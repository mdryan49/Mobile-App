[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# AI rendering endpoint (added in Phase 3)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
